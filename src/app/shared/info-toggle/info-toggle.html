<span class="info-toggle">
  <button
    type="button"
    class="btn btn-link info-toggle-button"
    [attr.aria-label]="label()"
    [attr.aria-controls]="id"
    [attr.aria-expanded]="isOpen()"
    [title]="label()"
    (click)="toggle()"
  >
    <i class="bi bi-info-circle" aria-hidden="true"></i>
  </button>

  @if (isOpen()) {
    <div class="info-toggle-panel" [id]="id" role="status" aria-live="polite">
      {{ description() }}
    </div>
  }
</span>
