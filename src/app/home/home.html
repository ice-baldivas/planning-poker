<div class="container py-5 min-vh-100 d-flex flex-column">
  <div class="row justify-content-center mb-4">
    <div class="col-12">
      <h1 class="text-center fw-bold">Planning Poker</h1>
    </div>
  </div>
  <div class="row justify-content-center align-content-center flex-grow-1">
    <div class="col-12 col-sm-10 col-md-7 col-lg-5">
      <!-- Tab nav -->
      <ul class="nav nav-pills nav-fill mb-4">
        <li class="nav-item">
          <button
            class="nav-link w-100"
            [class.active]="tab() === 'create'"
            (click)="tab.set('create')"
          >
            Create Session
          </button>
        </li>
        <li class="nav-item">
          <button
            class="nav-link w-100"
            [class.active]="tab() === 'join'"
            (click)="tab.set('join')"
          >
            Join Session
          </button>
        </li>
      </ul>

      @if (notice()) {
        <div class="alert alert-warning alert-dismissible" role="alert">
          {{ notice() }}
          <button
            type="button"
            class="btn-close"
            aria-label="Dismiss"
            (click)="dismissNotice()"
          ></button>
        </div>
      }

      @if (error()) {
        <div class="alert alert-danger" role="alert">{{ error() }}</div>
      }

      <!-- Create form -->
      @if (tab() === 'create') {
        <form (ngSubmit)="createSession()">
          <div class="mb-3">
            <!-- <label for="sessionName" class="form-label">Session name</label> -->
            <input
              id="sessionName"
              type="text"
              class="form-control"
              [(ngModel)]="sessionName"
              name="sessionName"
              placeholder="Session Name"
              required
              maxlength="100"
            />
          </div>
          <div class="mb-3">
            <!-- <label for="createDisplayName" class="form-label">Your name</label> -->
            <input
              id="createDisplayName"
              type="text"
              class="form-control"
              [(ngModel)]="createDisplayName"
              name="createDisplayName"
              placeholder="Your name"
              required
              maxlength="100"
            />
          </div>
          <fieldset class="mb-4">
            <legend class="form-label">Voting scale</legend>
            <div class="form-check d-flex align-items-center gap-2">
              <input
                class="form-check-input"
                type="radio"
                id="scaleFibonacci"
                name="votingScale"
                value="fibonacci"
                [(ngModel)]="selectedScale"
              />
              <label class="form-check-label flex-grow-1" for="scaleFibonacci">Fibonacci</label>
              <app-info-toggle [description]="fibonacciDescription" label="About Fibonacci" />
            </div>
            <div class="form-check d-flex align-items-center gap-2">
              <input
                class="form-check-input"
                type="radio"
                id="scaleTshirt"
                name="votingScale"
                value="tshirt"
                [(ngModel)]="selectedScale"
              />
              <label class="form-check-label flex-grow-1" for="scaleTshirt">T-Shirt Sizes</label>
              <app-info-toggle [description]="tshirtDescription" label="About T-Shirt Sizes" />
            </div>
          </fieldset>
          <fieldset class="mb-4">
            <legend class="form-label">Session mode</legend>
            <div class="form-check d-flex align-items-center gap-2">
              <input
                class="form-check-input"
                type="radio"
                id="modeFree"
                name="sessionMode"
                value="free"
                [(ngModel)]="selectedMode"
              />
              <label class="form-check-label flex-grow-1" for="modeFree">Free rounds</label>
              <app-info-toggle [description]="freeRoundsDescription" label="About Free rounds" />
            </div>
            <div class="form-check d-flex align-items-center gap-2">
              <input
                class="form-check-input"
                type="radio"
                id="modeStories"
                name="sessionMode"
                value="stories"
                [(ngModel)]="selectedMode"
              />
              <label class="form-check-label flex-grow-1" for="modeStories">Stories</label>
              <app-info-toggle [description]="storiesDescription" label="About Stories" />
            </div>
          </fieldset>
          <button
            type="submit"
            class="btn btn-primary w-100"
            [disabled]="!sessionName.trim() || !createDisplayName.trim() || isConnecting()"
          >
            Create Session
          </button>
          <app-connection-status />
        </form>
      }

      <!-- Join form -->
      @if (tab() === 'join') {
        <form (ngSubmit)="joinSession()">
          <div class="mb-3">
            <label for="sessionCode" class="form-label">Session code</label>
            <input
              id="sessionCode"
              type="text"
              class="form-control text-center fs-4 fw-bold letter-spacing"
              [(ngModel)]="sessionCode"
              name="sessionCode"
              maxlength="6"
              pattern="[0-9]{6}"
              inputmode="numeric"
              required
            />
          </div>
          <div class="mb-3">
            <label for="joinDisplayName" class="form-label">Your name</label>
            <input
              id="joinDisplayName"
              type="text"
              class="form-control"
              [(ngModel)]="joinDisplayName"
              name="joinDisplayName"
              required
              maxlength="100"
            />
          </div>
          <div class="mb-4 form-check">
            <input
              class="form-check-input"
              type="checkbox"
              id="observer"
              [(ngModel)]="joinAsObserver"
              name="joinAsObserver"
            />
            <label class="form-check-label" for="observer">Join as observer (no voting)</label>
          </div>
          <button
            type="submit"
            class="btn btn-primary w-100"
            [disabled]="
              sessionCode.trim().length !== 6 || !joinDisplayName.trim() || isConnecting()
            "
          >
            Join Session
          </button>
          <app-connection-status />
        </form>
      }
    </div>
  </div>
</div>
